<!DOCTYPE html>
<html lang="fr-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUTISUD 2 — Achats, ventes et trésorerie (septembre)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14; --bg2:#0f151f; --bg3:#16202d; --card:#121b27;
  --accent:#3ae08c; --accent2:#1fa968; --orange:#ff9f43; --blue:#4aa8ff; --violet:#a78bfa;
  --text:#e9eff7; --text2:#9fb0c5; --text3:#63758c;
  --border:#22303f; --radius:14px;
  --success:#3ae08c; --error:#ff5f6d; --warn:#ffc94d;
  --paper:#fdfdf9; --ink:#1d2733;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);
  background-image:radial-gradient(1100px 520px at 12% -8%,rgba(58,224,140,.10),transparent 60%),
                   radial-gradient(900px 460px at 96% 4%,rgba(255,159,67,.09),transparent 60%);
  background-attachment:fixed;min-height:100vh;line-height:1.55;-webkit-text-size-adjust:100%;
}
.mono{font-family:'Space Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
.hidden{display:none !important}

/* ---------- LAYOUT ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:16px}
.topbar{
  position:sticky;top:0;z-index:60;background:rgba(10,14,20,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.4px;font-size:1rem;display:flex;align-items:center;gap:8px}
.brand span.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.spacer{flex:1}
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  background:var(--bg3);border:1px solid var(--border);font-size:.8rem;font-weight:600;white-space:nowrap
}
.badge.acc{color:var(--accent);border-color:rgba(58,224,140,.35)}
.badge.org{color:var(--orange);border-color:rgba(255,159,67,.35)}

.progress-outer{height:5px;background:var(--bg3);width:100%}
.progress-inner{height:100%;background:linear-gradient(90deg,var(--accent),var(--orange));width:0%;transition:width .5s ease}

/* ---------- BUTTONS ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:12px;font-weight:700;font-size:.92rem;
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  transition:transform .12s ease,background .18s ease,border-color .18s ease;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#07130c;border:none}
.btn-orange{background:linear-gradient(135deg,var(--orange),#ff7a2f);color:#2b1400;border:none}
.btn-ghost{background:transparent}
.btn-acc-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-acc-outline:hover{background:var(--accent);color:#07130c}
.btn-org-outline{background:transparent;border:1.5px solid var(--orange);color:var(--orange)}
.btn-org-outline:hover{background:var(--orange);color:#2b1400}
.btn-sm{padding:7px 12px;font-size:.8rem;border-radius:9px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- CARDS ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card+.card{margin-top:14px}
h1{font-size:1.7rem;font-weight:800;line-height:1.2}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.muted{color:var(--text2)}
.small{font-size:.85rem}
.tiny{font-size:.78rem}

/* ---------- HOME ---------- */
.hero{text-align:center;padding:26px 18px}
.hero .kicker{color:var(--accent);font-weight:700;letter-spacing:2px;font-size:.75rem;text-transform:uppercase}
.hero h1{margin:10px 0 8px;font-size:2rem}
.hero p{color:var(--text2);max-width:640px;margin:0 auto}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:20px;text-align:left}
.feat div{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:13px}
.feat b{display:block;margin-bottom:3px}

/* ---------- HUB ---------- */
.chapter{margin-top:22px}
.chapter-title{
  display:flex;align-items:center;gap:10px;font-weight:800;font-size:.95rem;
  color:var(--orange);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px
}
.chapter-title:before{content:'';width:4px;height:18px;border-radius:2px;background:var(--orange)}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:11px}
.hub-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px;
  text-align:left;display:flex;gap:11px;align-items:flex-start;transition:.16s;width:100%
}
.hub-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.hub-num{
  flex:0 0 34px;height:34px;border-radius:9px;background:var(--bg3);display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:.9rem;font-family:'Space Mono',monospace
}
.hub-card.done .hub-num{background:rgba(58,224,140,.15);color:var(--accent)}
.hub-card.shown .hub-num{background:rgba(255,159,67,.15);color:var(--orange)}
.hub-card.skipped .hub-num{background:rgba(255,95,109,.14);color:var(--error)}
.hub-t{font-weight:700;font-size:.9rem;line-height:1.3}
.hub-s{color:var(--text3);font-size:.76rem;margin-top:3px}
.hub-star{margin-left:auto;font-size:1rem}

/* ---------- DOCUMENTS (papier) ---------- */
.doc{
  background:var(--paper);color:var(--ink);border-radius:10px;padding:16px;font-size:.83rem;
  box-shadow:0 8px 26px rgba(0,0,0,.4);border:1px solid #dcd8cc;overflow-x:auto
}
.doc+.doc{margin-top:12px}
.doc-tag{
  display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;
  padding:3px 9px;border-radius:5px;background:#1d2733;color:#fff;margin-bottom:10px
}
.doc-tag.nc{background:#b0342c}
.doc-tag.ext{background:#1c5f9e}
.doc-tag.note{background:#7a5b12}
.doc-head{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:10px}
.doc-party{min-width:170px}
.doc-party .lbl{font-size:.63rem;text-transform:uppercase;letter-spacing:1px;color:#7c7668;font-weight:700}
.doc-party .nm{font-weight:800;font-size:.95rem}
.doc-party .ln{font-size:.78rem;line-height:1.35}
.doc-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.doc-meta div{background:#efece2;border-radius:6px;padding:5px 9px;font-size:.75rem}
.doc-meta b{display:block;font-size:.63rem;text-transform:uppercase;letter-spacing:.8px;color:#7c7668}
table.doc-t{width:100%;border-collapse:collapse;font-size:.79rem;min-width:420px}
table.doc-t th{background:#e9e5d8;text-align:left;padding:6px 8px;font-size:.68rem;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid #cdc7b6}
table.doc-t td{padding:6px 8px;border-bottom:1px solid #e6e2d5}
table.doc-t .r{text-align:right;font-family:'Space Mono',monospace;white-space:nowrap}
.doc-tot{margin-top:10px;margin-left:auto;width:100%;max-width:330px;font-size:.8rem}
.doc-tot div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted #cdc7b6}
.doc-tot div.sum{font-weight:800;font-size:.98rem;border-bottom:none;border-top:2px solid var(--ink);margin-top:5px;padding-top:7px}
.doc-tot span:last-child{font-family:'Space Mono',monospace}
.doc-legal{margin-top:11px;padding:8px 10px;background:#fff7e0;border-left:3px solid #d9a520;font-size:.75rem;font-style:italic}
.doc-note{font-size:.85rem;line-height:1.5}
.doc-stamp{
  display:inline-block;transform:rotate(-7deg);border:2px solid #b0342c;color:#b0342c;
  padding:3px 10px;border-radius:5px;font-weight:800;letter-spacing:1.5px;font-size:.74rem;margin-top:8px
}

/* ---------- THÉORIE ---------- */
.theo{background:linear-gradient(135deg,rgba(74,168,255,.10),rgba(167,139,250,.07));border:1px solid rgba(74,168,255,.3);border-radius:12px;overflow:hidden}
.theo-h{display:flex;align-items:center;gap:8px;padding:11px 14px;font-weight:700;font-size:.9rem;width:100%;text-align:left;color:var(--blue)}
.theo-h .chev{margin-left:auto;transition:.2s}
.theo.open .chev{transform:rotate(180deg)}
.theo-b{padding:0 14px 14px;font-size:.87rem;color:var(--text2);display:none}
.theo.open .theo-b{display:block}
.theo-b b,.theo-b strong{color:var(--text)}
.theo-b ul{margin:6px 0 6px 18px}
.theo-b li{margin:3px 0}
.theo-b code{background:var(--bg3);padding:1px 6px;border-radius:5px;font-family:'Space Mono',monospace;font-size:.85em;color:var(--accent)}
.theo-b table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.82rem}
.theo-b th,.theo-b td{border:1px solid var(--border);padding:5px 8px;text-align:left}
.theo-b th{background:var(--bg3);color:var(--text)}
.theo.locked{background:var(--bg3);border-color:var(--border)}
.theo.locked .theo-h{color:var(--text3);cursor:default}
.theo-lock{padding:0 14px 13px;font-size:.82rem;color:var(--text3);line-height:1.5}
.theo-cnt{margin-left:auto;font-size:.76rem;font-weight:700;color:var(--orange);white-space:nowrap}

/* ---------- JOURNAL ---------- */
.jrn{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-top:14px}
.jrn-h{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg3);flex-wrap:wrap}
.jrn-badge{padding:4px 10px;border-radius:7px;font-weight:800;font-size:.74rem;letter-spacing:1px;text-transform:uppercase}
.j-ACHAT{background:rgba(255,95,109,.16);color:#ff8b95}
.j-VENTE{background:rgba(58,224,140,.16);color:var(--accent)}
.j-CAISSE{background:rgba(255,201,77,.16);color:var(--warn)}
.j-FINANCIER{background:rgba(74,168,255,.16);color:var(--blue)}
.j-OD{background:rgba(167,139,250,.16);color:var(--violet)}
.jrn-t{font-weight:700;font-size:.9rem}
.jrn-d{margin-left:auto;font-family:'Space Mono',monospace;font-size:.8rem;color:var(--text2)}
.jrn-state{font-size:1.05rem}
.jrn-body{padding:12px}

table.grid{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:.86rem}
table.grid th{
  font-size:.66rem;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);
  text-align:left;padding:0 6px 4px;font-weight:700
}
table.grid td{padding:0 3px}
table.grid input{
  width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:8px;
  padding:9px 8px;color:var(--text);font-size:.88rem;transition:.14s
}
table.grid input:focus{outline:none;border-color:var(--accent);background:var(--bg)}
table.grid input.num{font-family:'Space Mono',monospace;text-align:right}
table.grid input.code{font-family:'Space Mono',monospace;text-align:center}
.lbl-cell{
  font-size:.76rem;color:var(--text3);padding:0 6px;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;display:block;max-width:190px
}
.cell-bad input{border-color:var(--error) !important;background:rgba(255,95,109,.10) !important}
.cell-ok input{border-color:rgba(58,224,140,.55) !important;background:rgba(58,224,140,.07) !important}
.row-extra input{border-color:var(--warn) !important;background:rgba(255,201,77,.08) !important}
.del-btn{color:var(--text3);font-size:1rem;padding:6px}
.del-btn:hover{color:var(--error)}
.calc-hint{
  font-family:'Space Mono',monospace;font-size:.72rem;color:var(--accent);
  padding:2px 6px 0;display:block
}
.jrn-tot{
  display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px;
  font-family:'Space Mono',monospace;font-size:.8rem;color:var(--text2)
}
.jrn-tot b{color:var(--text)}
.jrn-tot.bal b{color:var(--accent)}
.jrn-tot.unbal b{color:var(--error)}
.jrn-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;align-items:center}

/* ---------- FEEDBACK ---------- */
.fb{border-radius:11px;padding:12px 14px;margin-top:11px;font-size:.87rem;border-left:4px solid}
.fb-ok{background:rgba(58,224,140,.10);border-color:var(--accent)}
.fb-bad{background:rgba(255,95,109,.09);border-color:var(--error)}
.fb-hint{background:rgba(255,201,77,.09);border-color:var(--warn)}
.fb-sol{background:rgba(255,159,67,.09);border-color:var(--orange)}
.fb h4{font-size:.9rem;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.fb ul{margin:4px 0 0 17px}
.fb li{margin:4px 0;color:var(--text2)}
.fb li b{color:var(--text)}
.fb .loc{font-family:'Space Mono',monospace;background:var(--bg3);padding:1px 6px;border-radius:5px;font-size:.8em;color:var(--orange)}

table.sol{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
table.sol th{background:var(--bg3);padding:6px 8px;text-align:left;font-size:.66rem;text-transform:uppercase;letter-spacing:.7px;color:var(--text3)}
table.sol td{padding:6px 8px;border-bottom:1px solid var(--border);font-family:'Space Mono',monospace;font-size:.82rem}
table.sol td.lb{font-family:'Outfit',sans-serif;color:var(--text2)}
table.sol td.r{text-align:right}

/* ---------- BILAN ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--text2);margin-bottom:12px}
.legend b{color:var(--text)}
.pill{display:inline-flex;align-items:center;gap:5px}
table.bilan{width:100%;border-collapse:collapse;font-size:.85rem}
table.bilan th{background:var(--bg3);padding:8px;text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.7px;color:var(--text3)}
table.bilan td{padding:8px;border-bottom:1px solid var(--border)}
table.bilan td.c{text-align:center;font-family:'Space Mono',monospace}
.grade{text-align:center;padding:20px}
.grade .medal{font-size:3.6rem;line-height:1}
.grade .gr{font-size:2.1rem;font-weight:800;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:12px;text-align:center}
.stat .v{font-size:1.5rem;font-weight:800;font-family:'Space Mono',monospace}
.stat .k{font-size:.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:.7px}

/* ---------- MODALS ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:14px}
.modal-box{
  background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:620px;
  max-height:88vh;display:flex;flex-direction:column;animation:slideUp .28s cubic-bezier(.2,.9,.3,1)
}
.modal-box.wide{max-width:900px}
@keyframes slideUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--border)}
.modal-h h3{flex:1;font-size:1.02rem}
.modal-b{padding:18px;overflow:auto}
.modal-f{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.close-x{font-size:1.35rem;color:var(--text3);padding:0 5px;line-height:1}
.close-x:hover{color:var(--text)}
.field{width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-size:.95rem}
.field:focus{outline:none;border-color:var(--accent)}
.err-msg{color:var(--error);font-size:.85rem;margin-top:9px;min-height:19px}
.ref-search{margin-bottom:10px}
.ref-list{max-height:52vh;overflow:auto}
.ref-item{display:flex;gap:10px;padding:7px 9px;border-bottom:1px solid var(--border);font-size:.85rem}
.ref-item .k{font-family:'Space Mono',monospace;color:var(--accent);font-weight:700;flex:0 0 82px}
.ref-item .v{color:var(--text2)}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:9px;background:var(--bg3);font-size:.83rem;font-weight:700;border:1px solid var(--border)}
.tab.on{background:var(--accent);color:#07130c;border-color:var(--accent)}
table.lb{width:100%;border-collapse:collapse;font-size:.85rem}
table.lb th{background:var(--bg3);padding:8px;text-align:left;font-size:.68rem;text-transform:uppercase;color:var(--text3)}
table.lb td{padding:8px;border-bottom:1px solid var(--border)}
table.lb tr.me{background:rgba(58,224,140,.09)}
.bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--orange))}

/* ---------- CONFETTIS ---------- */
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:300;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(104vh) rotate(760deg);opacity:0}}

/* ---------- RESPONSIVE ---------- */
@media(max-width:768px){
  .wrap{padding:12px}
  .hero h1{font-size:1.55rem}
  table.grid,table.grid tbody,table.grid tr,table.grid td{display:block;width:100%}
  table.grid thead{display:none}
  table.grid tr{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:9px;margin-bottom:9px;position:relative}
  table.grid td{padding:4px 0}
  table.grid td:before{
    content:attr(data-l);display:block;font-size:.63rem;text-transform:uppercase;
    letter-spacing:.8px;color:var(--text3);font-weight:700;margin-bottom:3px
  }
  table.grid td.no-l:before{display:none}
  .lbl-cell{max-width:none}
  .del-btn{position:absolute;top:6px;right:6px}
  .doc{font-size:.79rem;padding:12px}
  .hub-grid{grid-template-columns:1fr}
}
@media(max-width:480px){
  .brand{font-size:.88rem}
  .badge{font-size:.72rem;padding:4px 9px}
  .btn{padding:10px 14px;font-size:.86rem}
  .grade .medal{font-size:3rem}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="dot"></span> OUTISUD 2 — Écritures</div>
    <div class="spacer"></div>
    <div class="badge acc" id="bScore">⭐ 0 pts</div>
    <div class="badge org mono" id="bTimer">⏱️ 00:00</div>
    <button class="badge" id="bHub" onclick="goHub()">☰ Exercices</button>
  </div>
  <div class="progress-outer"><div class="progress-inner" id="progBar"></div></div>
</div>

<div class="wrap">
  <div id="screenHome"></div>
  <div id="screenHub" class="hidden"></div>
  <div id="screenEx" class="hidden"></div>
  <div id="screenFinal" class="hidden"></div>
</div>

<div id="modalHost"></div>

<script>
/* ============================================================
   OUTISUD — Rappel des écritures comptables
   Application pédagogique — Institut Saint-Luc Frameries
   Correction automatique • ordre des lignes libre
   ============================================================ */

const TRACKING = {
  appName: "Ecritures Comptables OUTISUD 2",
  totalNiveaux: 20,
  sessionId: null,
  scriptUrl: "https://script.google.com/macros/s/AKfycbx9bRMVuHU2mgFLii1KcQXD3LdZahnDH1rf1cWv9RuDvQAt0l3VtLtxzmbH7MtpJWRjfA/exec"
};

/* ---------- PLAN COMPTABLE (extrait PCMN 4 chiffres) ---------- */
const PCMN = {
"1000":"Capital souscrit","1300":"Réserve légale","1330":"Réserves disponibles","1400":"Bénéfice reporté",
"1410":"Perte reportée (-)","1740":"Autres emprunts",
"2000":"Frais de constitution","2100":"Frais de recherche et développement","2200":"Terrains",
"2210":"Constructions","2300":"Installations techniques et machines","2320":"Outillage",
"2400":"Mobilier et matériel de bureau","2409":"Amortissements sur mobilier et matériel de bureau (-)",
"2410":"Matériel roulant","2419":"Amortissements sur matériel roulant (-)",
"3400":"Stock de marchandises","3600":"Acomptes versés sur stocks",
"4000":"Clients","4010":"Effets à recevoir","4040":"Produits à recevoir",

/* Variante « une ligne de banque (ou de caisse) par opération » */
function splitAlt(lines, bank){
  const out = [];
  lines.filter(l=>l.c!==bank).forEach(l=>{
    out.push(l);
    out.push(l.db!=null ? {c:bank, cr:l.db} : {c:bank, db:l.cr});
  });
  return out;
}

 theo:{open:true, t:"Rappel — la note de crédit d'un fournisseur européen", h:`
  <p>Lors de l'achat intracommunautaire, OUTISUD avait <b>autoliquidé</b> la T.V.A. : une T.V.A. due (4511) et la même T.V.A. déductible. La note de crédit <b>annule une partie</b> de cette autoliquidation, dans l'autre sens :</p>
  <ul><li>la T.V.A. <b>due</b> diminue → <b>4511 au débit</b> ;</li><li>la T.V.A. <b>déductible</b> diminue → compte de T.V.A. déductible I.C. <b>au crédit</b> ;</li>
  <li>les bases sont créditées avec les grilles <b>81(-) + 84</b> (84 = notes de crédit sur opérations intracommunautaires) ;</li>
  <li>codes Popsy <b>6IM</b> / <b>21IM</b> selon le taux belge du produit ; l'emballage consigné rendu → 4050 au crédit, code EX.</li></ul>
  <p>Comme pour l'achat, l'effet net sur la T.V.A. est <b>nul</b>.</p>`},
 exp:`Retour du produit A (6 %) : <b>6040</b> crédit 1.500,00, code 6IM. Remise sur B (21 %) : <b>6080</b> crédit 150,00, code 21IM. Emballages rendus : <b>4050</b> crédit 50,00 (EX). T.V.A. autoliquidée annulée : 1.500 × 6 % + 150 × 21 % = <b>121,50</b>, au crédit du <b>4111</b> (grille 63) et au débit du <b>4511</b> (grille 64). Le fournisseur est débité de 1.700,00. <i>Variantes acceptées : 4110 ou 4514 à la place du 4111.</i>`,

   l:[{c:"6040",d:"81(-)+84",p:"6IM",cr:1500},{c:"4050",p:"EX",cr:50},{c:"6080",d:"81(-)+84",p:"21IM",cr:150},

 theo:{open:true, t:"Rappel — l'acquisition intracommunautaire (A.I.C.)", h:`
  <p>Le fournisseur français facture <b>sans T.V.A.</b> : c'est OUTISUD qui <b>autoliquide</b> la T.V.A. belge, au taux belge de chaque produit.</p>
  <table><tr><th>Compte</th><th>Sens</th><th>Grille</th></tr>
  <tr><td>6040 — achats (une ligne par taux)</td><td>Débit</td><td>81 + 86</td></tr>
  <tr><td>T.V.A. déductible I.C.</td><td>Débit</td><td>59</td></tr>
  <tr><td>4511 — T.V.A. due I.C.</td><td>Crédit</td><td>55</td></tr>
  <tr><td>4400 — fournisseur</td><td>Crédit</td><td>—</td></tr></table>
  <p>Codes Popsy : <b>6IM</b> et <b>21IM</b>. Les règles de la facture belge restent valables : emballage perdu = même taux que son produit, emballage consigné = 4050 (EX), transport au taux le plus bas, T.V.A. calculée <b>escompte déduit</b>.</p>`},
 exp:`<b>6040 à 6 %</b> = produit A 1.000 + transport 75 = <b>1.075,00</b> (6IM) ; <b>6040 à 21 %</b> = produit B 10.000 + emballage perdu B 25 = <b>10.025,00</b> (21IM) ; <b>4050</b> = 50,00 (EX). T.V.A. autoliquidée escompte déduit : 1.053,50 × 6 % + 9.824,50 × 21 % = <b>2.126,36</b>, au débit du <b>4111</b> (59) et au crédit du <b>4511</b> (55). <i>Variante acceptée : 4110 à la place du 4111.</i>`,

   hint:"Pas de T.V.A. sur la facture : qui la calcule ? Classe chaque ligne par taux (l'emballage perdu suit son produit) et n'oublie pas l'escompte dans le calcul de la T.V.A.",
   l:[{c:"6040",d:"81+86",p:"6IM",db:1075},{c:"6040",d:"81+86",p:"21IM",db:10025},{c:"4050",p:"EX",db:50},
      {c:"4111",d:"59",db:2126.36},{c:"4511",d:"55",cr:2126.36},{c:"4400",cr:11150}],
   altAcc:{"4111":["4110"]}}]},

/* ============================================================
   NORMALISATION & CALCUL
   ============================================================ */
function isExpr(s){ return /[+\-*/×÷()]/.test(String(s).replace(/^-/,'')); }

function evalExpr(raw){
  let s = String(raw).trim();
  if(!s) return null;
  s = s.replace(/×/g,'*').replace(/÷/g,'/').replace(/\s/g,'').replace(/,/g,'.');
  if(!/^[0-9.+\-*/()]+$/.test(s)) return null;
  try{
    const v = Function('"use strict";return ('+s+')')();
    return (typeof v==='number' && isFinite(v)) ? v : null;
  }catch(e){ return null; }
}

/* Convertit une saisie en nombre (gère 1.350,50 / 1350,5 / 1.350 / expressions) */
function parseNum(raw){
  if(raw===null || raw===undefined) return null;
  let s = String(raw).trim();
  if(!s) return null;
  if(isExpr(s.replace(/^[-+]/,''))) { const v = evalExpr(s); if(v!==null) return v; }
  s = s.replace(/\s|\u00A0|€/g,'');
  const hasC = s.includes(','), hasP = s.includes('.');
  if(hasC && hasP){ s = s.replace(/\./g,'').replace(',','.'); }
  else if(hasC){ s = s.replace(',', '.'); }
  else if(hasP){
    const parts = s.split('.');
    // "1.350" ou "1.350.000" => séparateur de milliers
    if(parts.length>2 || (parts.length===2 && parts[1].length===3 && parts[0].length<=3)) s = parts.join('');
  }
  const v = parseFloat(s);
  return isNaN(v) ? null : v;
}

function fmt(n){
  if(n===null||n===undefined||n==='') return '';
  return Number(n).toLocaleString('fr-BE',{minimumFractionDigits:2, maximumFractionDigits:2});
}

function normAcc(s){ return String(s||'').replace(/[^0-9]/g,''); }

function normPop(s){ return String(s||'').toUpperCase().replace(/[\s.\-_]/g,''); }

function normDecl(s){
  let x = String(s||'').toUpperCase().replace(/\s/g,'').replace(/\(\-\)/g,'-').replace(/[.;]/g,'');
  if(!x) return '';
  const parts = x.split('+').filter(Boolean).map(p=>{
    const m = p.match(/^(\d+)(.*)$/);
    if(m && m[1].length===1) return '0'+m[1]+m[2];
    return p;
  });
  return parts.sort().join('+');
}

function eq(a,b){ return Math.abs(a-b) <= 0.021; }

/* ============================================================
   MOTEUR DE CORRECTION — ordre des lignes libre
   ============================================================ */
function correct(rows, sol){
  const res = { ok:false, errs:[], cells:[], extra:[], missing:0, balOK:true, totD:0, totC:0 };

  // 1. Préparation des lignes de l'élève
  const used = [];
  rows.forEach((r,i)=>{
    const acc = normAcc(r.c), db = parseNum(r.db), cr = parseNum(r.cr);
    const empty = !acc && db===null && cr===null && !normDecl(r.d) && !normPop(r.p);
    if(empty) return;
    used.push({ i, acc, decl:normDecl(r.d), pop:normPop(r.p),
                db: db||0, cr: cr||0, rawDb:db, rawCr:cr, matched:false });
  });
  res.cells = rows.map(()=>({}));

  if(used.length===0){
    res.errs.push({txt:"L'écriture est vide : encode au moins une ligne avant de vérifier."});
    return res;
  }

  // 2. Contrôles de forme
  used.forEach(u=>{
    if(u.rawDb!==null && u.rawCr!==null && u.rawDb!==0 && u.rawCr!==0){
      res.cells[u.i].db = res.cells[u.i].cr = false;
      res.errs.push({loc:u.acc||('ligne '+(u.i+1)), txt:"une même ligne ne peut pas être à la fois au débit ET au crédit."});
    }
    if(!u.acc){
      res.cells[u.i].c = false;
      res.errs.push({loc:'ligne '+(u.i+1), txt:"le numéro de compte est manquant."});
    } else if(u.acc.length!==4){
      res.cells[u.i].c = false;
      res.errs.push({loc:u.acc, txt:"un compte du P.C.M.N. comporte exactement 4 chiffres."});
    } else if(!PCMN[u.acc]){
      res.cells[u.i].c = false;
      res.errs.push({loc:u.acc, txt:"ce numéro de compte n'existe pas dans le plan comptable. Ouvre 📖 Plan comptable pour vérifier."});
    }
    if(u.acc && u.db===0 && u.cr===0){
      res.cells[u.i].db = false;
      res.errs.push({loc:u.acc, txt:"aucun montant n'a été encodé pour cette ligne."});
    }
    res.totD += u.db; res.totC += u.cr;
  });

  // 3. Appariement compte/sens/montant (3 passes)
  const S = sol.map((s,k)=>({
    k, acc:s.c, amount:(s.db!=null?s.db:s.cr), sens:(s.db!=null?'D':'C'),
    decl: (s.dAlt || [s.d||'']).map(normDecl),
    pop:  (s.pAlt || [s.p||'']).map(normPop),
    matched:false, row:null
  }));

  const sensOf = u => u.db>0 ? 'D' : (u.cr>0 ? 'C' : '');
  const amtOf  = u => u.db>0 ? u.db : u.cr;

  const pass = (test) => {
    S.forEach(s=>{
      if(s.matched) return;
      const cand = used.find(u=> !u.matched && u.acc.length===4 && test(u,s));
      if(cand){ s.matched=true; s.row=cand; cand.matched=true; }
    });
  };
  pass((u,s)=> u.acc===s.acc && sensOf(u)===s.sens && eq(amtOf(u), s.amount));
  pass((u,s)=> u.acc===s.acc && sensOf(u)===s.sens);
  pass((u,s)=> u.acc===s.acc);

  // 4. Analyse des lignes appariées
  S.forEach(s=>{
    if(!s.matched) return;
    const u = s.row, c = res.cells[u.i];
    const uSens = sensOf(u), uAmt = amtOf(u);

    if(uSens !== s.sens){
      c.db = false; c.cr = false;
      res.errs.push({loc:s.acc, txt:"le sens est inversé : ce montant n'est pas du bon côté (débit / crédit)."});
    } else if(!eq(uAmt, s.amount)){
      if(s.sens==='D') c.db = false; else c.cr = false;
      res.errs.push({loc:s.acc, txt:"le montant n'est pas correct. Recalcule-le à partir du document."});
    } else {
      if(s.sens==='D') c.db = true; else c.cr = true;
    }

    if(!s.decl.includes(u.decl)){
      c.d = false;
      res.errs.push({loc:s.acc, txt: s.decl[0]==='' ?
        "aucun code de la déclaration T.V.A. ne doit figurer sur cette ligne."
        : "le code de la déclaration T.V.A. n'est pas correct. Ouvre 📋 Grilles T.V.A."});
    } else if(u.decl) c.d = true;

    if(!s.pop.includes(u.pop)){
      c.p = false;
      res.errs.push({loc:s.acc, txt: s.pop[0]==='' ?
        "aucun code Popsy ne doit figurer sur cette ligne."
        : "le code T.V.A. Popsy n'est pas correct. Ouvre ⚙️ Codes Popsy."});
    } else if(u.pop) c.p = true;

    c.acc = true;
  });

  // 5. Lignes en trop / manquantes
  used.forEach(u=>{
    if(!u.matched && u.acc.length===4 && PCMN[u.acc]){
      res.extra.push(u.i);
      res.cells[u.i].c = false;
      const dup = S.some(s=> s.acc===u.acc);
      res.errs.push({loc:u.acc, txt: dup
        ? "ce compte est encodé plusieurs fois : dans cette écriture, il ne doit apparaître qu'une seule fois."
        : "ce compte ne fait pas partie de cette écriture."});
    }
  });
  res.missing = S.filter(s=>!s.matched).length;
  if(res.missing>0){
    res.errs.push({txt:"Il manque <b>"+res.missing+" ligne"+(res.missing>1?'s':'')+"</b> à cette écriture."});
  }

  // 6. Équilibre
  res.balOK = eq(res.totD, res.totC);
  if(!res.balOK){
    res.balMsg = "Contrôle d'équilibre : total débit <b>"+fmt(res.totD)+" €</b> ≠ total crédit <b>"+fmt(res.totC)+" €</b>. Dans toute écriture, débit = crédit.";
  }

  res.ok = res.errs.length===0 && res.missing===0 && res.extra.length===0;
  return res;
}

function party(p, lbl){
  if(!p) return '';
  let h = '<div class="doc-party"><div class="lbl">'+lbl+'</div><div class="nm">'+p.nom+'</div>';
  (p.adr||[]).forEach(a=> h += '<div class="ln">'+a+'</div>');
  if(p.tva) h += '<div class="ln">N° T.V.A. : '+p.tva+'</div>';
  if(p.iban) h += '<div class="ln">IBAN : '+p.iban+'</div>';
  return h+'</div>';
}

function renderDoc(d){
  if(d.t==='note'){
    return '<div class="doc"><span class="doc-tag note">'+(d.titre||'Note')+'</span><div class="doc-note">'+d.html+'</div></div>';
  }
  if(d.t==='ext'){
    let h = '<div class="doc"><span class="doc-tag ext">'+(d.tag||'Extrait de compte')+' n° '+d.num+'</span>';
    h += '<div class="doc-meta">'+(d.banque?'<div><b>Banque</b>'+d.banque+'</div>':'')+'<div><b>Compte à vue</b>'+d.compte+'</div><div><b>Titulaire</b>SPRL OUTISUD</div></div>';
    h += '<table class="doc-t"><thead><tr><th>Date</th><th>Libellé</th><th class="r">Montant (€)</th></tr></thead><tbody>';
    h += '<tr><td>'+d.ancD+'</td><td>ANCIEN SOLDE</td><td class="r">'+d.ancS+'</td></tr>';
    d.ops.forEach(o=> h += '<tr><td>'+o.d+'</td><td>'+o.lib+'</td><td class="r">'+o.mt+'</td></tr>');
    if(!d.ops.length) h += '<tr><td>—</td><td><i>Aucun mouvement</i></td><td class="r">—</td></tr>';
    h += '<tr><td>'+d.nouD+'</td><td><b>NOUVEAU SOLDE</b></td><td class="r"><b>'+d.nouS+'</b></td></tr>';
    return h+'</tbody></table></div>';
  }
  if(d.t==='caisse'){
    let h = '<div class="doc"><span class="doc-tag ext">Feuille de caisse n° '+d.num+' — '+d.mois+'</span>';
    h += '<div class="doc-meta"><div><b>Titulaire</b>SPRL OUTISUD</div><div><b>Situation initiale</b>'+d.init+' €</div></div>';
    h += '<table class="doc-t"><thead><tr><th>Date</th><th>Libellé</th><th class="r">Recettes (€)</th><th class="r">Dépenses (€)</th></tr></thead><tbody>';
    d.ops.forEach(o=> h += '<tr><td>'+o.d+'</td><td>'+o.lib+'</td><td class="r">'+(o.rec||'')+'</td><td class="r">'+(o.dep||'')+'</td></tr>');
    h += '<tr><td></td><td><b>SITUATION FINALE</b></td><td class="r" colspan="2"><b>'+d.fin+' €</b></td></tr>';
    return h+'</tbody></table></div>';
  }
  // facture ou note de crédit
  const nc = d.t==='nc';
  let h = '<div class="doc"><span class="doc-tag'+(nc?' nc':'')+'">'+(nc?'Note de crédit':'Facture')+' n° '+d.num+'</span>';
  h += '<div class="doc-head">'+party(d.de, nc?'Émise par':'Fournisseur / émetteur')+party(d.a, nc?'Destinataire':'Client / destinataire')+'</div>';
  h += '<div class="doc-meta"><div><b>Numéro</b>'+d.num+'</div><div><b>Date</b>'+d.date+'</div>';
  if(d.ech) h += '<div><b>Échéance</b>'+d.ech+'</div>';
  if(d.ref) h += '<div><b>Référence</b>'+d.ref+'</div>';
  h += '</div>';

  h += '<table class="doc-t"><thead><tr><th style="width:52px">Qté</th><th>Désignation</th><th class="r">P.U. H.T.V.A.</th><th class="r">Montant H.T.V.A.</th></tr></thead><tbody>';
  let brut = 0;
  d.lignes.forEach(l=>{
    h += '<tr><td>'+(l.q||'')+'</td><td>'+l.des+'</td><td class="r">'+(l.pu||'')+'</td><td class="r">'+l.mt+'</td></tr>';
    const v = parseNum(l.mt); if(v!==null) brut += v;
  });
  h += '</tbody></table>';

  h += '<div class="doc-tot">';
  if(d.rem && d.rem.length){
    h += '<div><span>Sous-total H.T.V.A.</span><span>'+fmt(brut)+' €</span></div>';
    d.rem.forEach(r=> h += '<div><span>'+r.lib+'</span><span>'+r.mt+' €</span></div>');
  }
  h += '<div><span>Total H.T.V.A.</span><span>'+d.ht+' €</span></div>';
  if(d.escompte) h += '<div><span>'+d.escompte.lib+'</span><span>'+d.escompte.base+' €</span></div>';
  (d.tva||[]).forEach(t=> h += '<div><span>T.V.A. '+t.taux+' sur '+t.base+'</span><span>'+t.mt+' €</span></div>');
  h += '<div><span>Total T.V.A.</span><span>'+d.ttva+' €</span></div>';
  h += '<div class="sum"><span>'+(nc?'TOTAL À REMBOURSER':'TOTAL À PAYER')+'</span><span>'+d.pay+' €</span></div>';
  h += '</div>';

  if(d.legal) h += '<div class="doc-legal">'+d.legal+'</div>';
  if(d.mentions) h += '<div style="margin-top:8px;font-size:.78rem">'+d.mentions.join(' — ')+'</div>';
  if(d.acquit) h += '<div class="doc-stamp">POUR ACQUIT</div>';
  return h+'</div>';
}

  const locked = st.stat[ji]!=='todo';

  let h = '<div class="jrn"><div class="jrn-h">';
  h += '<span class="jrn-badge j-'+j.j+'">'+j.j+'</span>';
  h += '<span class="jrn-t">'+JNAMES[j.j]+' — '+j.t+'</span>';
  h += '<span class="jrn-d">'+j.d+'</span>';
  if(icon) h += '<span class="jrn-state">'+icon+'</span>';
  h += '</div><div class="jrn-body">';

  h += '<table class="grid"><thead><tr>'
     + '<th style="width:15%">N° compte</th><th style="width:13%">Décl. T.V.A.</th><th style="width:14%">Code Popsy</th>'
     + '<th style="width:22%">Libellé</th><th style="width:16%">Débit</th><th style="width:16%">Crédit</th><th style="width:4%"></th>'
     + '</tr></thead><tbody>';

  rows.forEach((r,ri)=>{
    const c = res ? (res.cells[ri]||{}) : {};
    const cls = f => c[f]===false ? ' class="cell-bad"' : (c[f]===true ? ' class="cell-ok"' : '');
    const dis = locked ? ' disabled' : '';
    h += '<tr>';
    h += '<td data-l="N° compte"'+cls('c')+'><input class="code" maxlength="4" inputmode="numeric" value="'+esc(r.c)+'" placeholder="0000"'+dis+' oninput="onCell('+ji+','+ri+',\'c\',this.value)"></td>';
    h += '<td data-l="Code déclaration T.V.A."'+cls('d')+'><input class="code" maxlength="12" value="'+esc(r.d)+'" placeholder="—"'+dis+' oninput="onCell('+ji+','+ri+',\'d\',this.value)"></td>';
    h += '<td data-l="Code T.V.A. Popsy"'+cls('p')+'><input class="code" maxlength="12" value="'+esc(r.p)+'" placeholder="—"'+dis+' oninput="onCell('+ji+','+ri+',\'p\',this.value)"></td>';
    h += '<td data-l="Libellé (automatique)" class="no-l-desktop"><span class="lbl-cell" id="lb-'+ji+'-'+ri+'">'+(PCMN[normAcc(r.c)]||'—')+'</span></td>';
    h += '<td data-l="Débit"'+cls('db')+'><input class="num" inputmode="decimal" value="'+esc(r.db)+'" placeholder="0,00"'+dis+' oninput="onAmount('+ji+','+ri+',\'db\',this)"><span class="calc-hint" id="ch-'+ji+'-'+ri+'-db"></span></td>';
    h += '<td data-l="Crédit"'+cls('cr')+'><input class="num" inputmode="decimal" value="'+esc(r.cr)+'" placeholder="0,00"'+dis+' oninput="onAmount('+ji+','+ri+',\'cr\',this)"><span class="calc-hint" id="ch-'+ji+'-'+ri+'-cr"></span></td>';
    h += '<td class="no-l">'+(locked?'':'<button class="del-btn" title="Supprimer la ligne" onclick="delRow('+ji+','+ri+')">🗑</button>')+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table>';

  // totaux
  let tD=0, tC=0;
  rows.forEach(r=>{ tD += (parseNum(r.db)||0); tC += (parseNum(r.cr)||0); });
  const bal = eq(tD,tC) && tD>0;
  h += '<div class="jrn-tot '+(tD||tC ? (bal?'bal':'unbal') : '')+'">Total débit : <b>'+fmt(tD)+' €</b> &nbsp;•&nbsp; Total crédit : <b>'+fmt(tC)+' €</b>'+(tD||tC?(bal?' ✔':' ✖'):'')+'</div>';

  if(!locked){
    h += '<div class="jrn-actions">';
    h += '<button class="btn btn-sm btn-ghost" onclick="addRow('+ji+')">➕ Ajouter une ligne</button>';
    h += '<button class="btn btn-sm btn-primary" onclick="checkJ('+ji+')">✅ Vérifier l\'écriture</button>';
    const canSol = st.tries[ji] >= 2;
    h += '<button class="btn btn-sm btn-org-outline" onclick="showSol('+ji+')"'+(canSol?'':' disabled')+'>👁 Voir la solution</button>';
    h += '<span class="tiny muted">'+(canSol ? 'Essais : '+st.tries[ji] : 'Solution disponible après 2 essais ('+st.tries[ji]+'/2)')+'</span>';
    h += '</div>';
  }

  h += '<div id="fb-'+ji+'">'+(res ? feedbackHTML(ji,res) : '')+'</div>';
  if(st.stat[ji]==='shown') h += solTableHTML(j);
  h += '</div></div>';
  return h;
}

function feedbackHTML(ji,res){
  if(res.ok){
    const st = APP.st[APP.cur];
    return '<div class="fb fb-ok"><h4>✅ Écriture correcte</h4><span class="muted small">'
      + (st.cat[ji]==='first' ? 'Parfait, du premier coup ! ' : 'Bravo, tu as trouvé après correction. ')
      + 'Compte, sens, montant, code de la déclaration T.V.A. et code Popsy : tout est juste.</span></div>';
  }
  let h = '<div class="fb fb-bad"><h4>❌ À corriger — voici précisément où</h4><ul>';
  const seen = new Set();
  res.errs.forEach(e=>{
    const key = (e.loc||'')+'|'+e.txt;
    if(seen.has(key)) return; seen.add(key);
    h += '<li>'+(e.loc ? '<span class="loc">'+e.loc+'</span> ' : '')+e.txt+'</li>';
  });
  h += '</ul>';
  if(res.balMsg) h += '<div class="small" style="margin-top:8px;color:var(--warn)">⚖️ '+res.balMsg+'</div>';
  h += '<div class="tiny muted" style="margin-top:8px">Les cases fautives sont encadrées en rouge, les cases correctes en vert. Corrige puis clique à nouveau sur « Vérifier ».</div></div>';
  const j = EXOS[APP.cur].jx[ji];
  if(j.hint) h += '<div class="fb fb-hint"><h4>💡 Piste de réflexion</h4><span class="muted small">'+j.hint+'</span></div>';
  return h;
}

function solTableHTML(j){
  let h = '<div class="fb fb-sol"><h4>👁 Écriture correcte</h4>';
  h += '<table class="sol"><thead><tr><th>Compte</th><th>Décl. T.V.A.</th><th>Popsy</th><th>Libellé</th><th class="r">Débit</th><th class="r">Crédit</th></tr></thead><tbody>';
  j.l.forEach(l=>{
    h += '<tr><td>'+l.c+'</td><td>'+(l.d||'—')+'</td><td>'+(l.p||'—')+'</td><td class="lb">'+(PCMN[l.c]||'')+'</td>'
       + '<td class="r">'+(l.db!=null?fmt(l.db):'')+'</td><td class="r">'+(l.cr!=null?fmt(l.cr):'')+'</td></tr>';
  });
  let tD=0,tC=0; j.l.forEach(l=>{ tD+=(l.db||0); tC+=(l.cr||0); });
  h += '<tr><td colspan="4"><b>TOTAUX</b></td><td class="r"><b>'+fmt(tD)+'</b></td><td class="r"><b>'+fmt(tC)+'</b></td></tr>';
  return h+'</tbody></table><div class="tiny muted" style="margin-top:7px">Recopie cette écriture sur ta feuille papier ('+EXOS[APP.cur].page+'), puis analyse l\'explication ci-dessous.</div></div>';
}

/* ============================================================
   INTERACTIONS DE SAISIE
   ============================================================ */
function onCell(ji,ri,f,v){
  APP.grid[APP.cur][ji][ri][f] = v;
  if(f==='c'){
    const el = document.getElementById('lb-'+ji+'-'+ri);
    if(el) el.textContent = PCMN[normAcc(v)] || '—';
  }
}
function onAmount(ji,ri,f,el){
  APP.grid[APP.cur][ji][ri][f] = el.value;
  const hint = document.getElementById('ch-'+ji+'-'+ri+'-'+f);
  if(hint){
    const v = el.value.trim();
    if(v && isExpr(v.replace(/^[-+]/,''))){
      const r = evalExpr(v);
      hint.textContent = r===null ? '' : '= '+fmt(r)+' €';
    } else hint.textContent = '';
  }
  updateTotals(ji);
}
function updateTotals(ji){
  const rows = APP.grid[APP.cur][ji];
  let tD=0,tC=0; rows.forEach(r=>{ tD+=(parseNum(r.db)||0); tC+=(parseNum(r.cr)||0); });
  const box = document.querySelectorAll('#jxHost .jrn-tot')[ji];
  if(!box) return;
  const bal = eq(tD,tC) && tD>0;
  box.className = 'jrn-tot '+((tD||tC)?(bal?'bal':'unbal'):'');
  box.innerHTML = 'Total débit : <b>'+fmt(tD)+' €</b> &nbsp;•&nbsp; Total crédit : <b>'+fmt(tC)+' €</b>'+((tD||tC)?(bal?' ✔':' ✖'):'');
}
function addRow(ji){ APP.grid[APP.cur][ji].push(emptyRow()); renderJx(); }
function delRow(ji,ri){
  const g = APP.grid[APP.cur][ji];
  if(g.length<=1) return;
  g.splice(ri,1);
  if(LASTRES[ji]) delete LASTRES[ji];
  renderJx();
}

/* ============================================================
   VÉRIFICATION / SOLUTION / PROGRESSION
   ============================================================ */
function checkJ(ji){
  const ex = EXOS[APP.cur], st = APP.st[APP.cur];
  st.tries[ji]++;
  let res = correct(APP.grid[APP.cur][ji], ex.jx[ji].l);
  (ex.jx[ji].alt||[]).forEach(alt=>{
    if(res.ok) return;
    const r2 = correct(APP.grid[APP.cur][ji], alt);
    if(r2.ok || (r2.errs.length + r2.missing) < (res.errs.length + res.missing)) res = r2;
  });
  LASTRES[ji] = res;
  if(res.ok){
    st.stat[ji] = 'ok';
    st.cat[ji]  = st.tries[ji]===1 ? 'first' : 'retry';
    const p = st.tries[ji]===1 ? PTS_JOURNAL : (st.tries[ji]===2 ? 7 : 5);
    st.pts += p; APP.score += p;
  }
  renderJx(); renderTheo(); updateHeader();
  if(res.ok) afterJournal(ji);
}

function showSol(ji){
  const st = APP.st[APP.cur];
  st.stat[ji] = 'shown'; st.cat[ji] = 'shown';
  st.pts += 2; APP.score += 2;
  delete LASTRES[ji];
  renderJx(); renderTheo(); updateHeader(); afterJournal(ji);
}

function afterJournal(ji){
  const st = APP.st[APP.cur];
  if(st.stat.every(s=>s!=='todo')) finishExercise();
  else setTimeout(()=>{
    const nodes = document.querySelectorAll('#jxHost .jrn');
    if(nodes[ji+1]) nodes[ji+1].scrollIntoView({behavior:'smooth', block:'start'});
  }, 250);
}

function skipExercise(){
  const st = APP.st[APP.cur];
  if(!confirm("Passer cet exercice ? Les écritures non résolues seront comptées comme « non trouvées » (0 point).")) return;
  st.stat = st.stat.map(s=> s==='todo' ? 'shown' : s);
  st.cat  = st.cat.map((c,i)=> c===null ? 'shown' : c);
  st.skipped = true;
  finishExercise();
}

function finishExercise(){
  const ex = EXOS[APP.cur], st = APP.st[APP.cur];
  st.done = true;
  const max = ex.jx.length * PTS_JOURNAL;
  const temps = stopExerciseTimer();
  if(!st.sent){
    st.sent = true;
    sendResult('Ex '+ex.n+' — '+ex.t, st.pts, max, temps);
  }
  const pct = max ? st.pts/max : 0;
  if(pct>=0.7) confetti();
  renderEx(); updateHeader();
  setTimeout(()=>{ const b=document.getElementById('exBilan'); if(b) b.scrollIntoView({behavior:'smooth',block:'center'}); }, 200);
}

  ['screenHome','screenHub','screenEx','screenFinal'].forEach(s=>{

function theoUnlocked(){
  const st = APP.st[APP.cur];
  if(st.theoUnlocked) return true;
  if(st.done || st.skipped || st.tries.some(t=>t>=2)){ st.theoUnlocked = true; return true; }
  return false;
}
function renderTheo(){
  const host = document.getElementById('theoHost');
  if(!host) return;
  const ex = EXOS[APP.cur], st = APP.st[APP.cur];
  if(!ex.theo){ host.innerHTML=''; return; }
  if(!theoUnlocked()){
    const max = st.tries.length ? Math.max.apply(null, st.tries) : 0;
    host.innerHTML = '<div class="theo locked">'
      + '<div class="theo-h">🔒 Rappel théorique — verrouillé'
      + '<span class="theo-cnt">'+max+' / 2 essais</span></div>'
      + '<div class="theo-lock">Cherche d\'abord par toi-même : c\'est en essayant que tu retiens. '
      + 'Le rappel théorique se débloque après <b>2 tentatives</b> sur une écriture, en même temps que le bouton « Voir la solution ».</div></div>';
    return;
  }
  if(st.theoOpen === undefined) st.theoOpen = !!ex.theo.open;
  host.innerHTML = '<div class="theo'+(st.theoOpen?' open':'')+'" id="theoBox">'
    + '<button class="theo-h" onclick="toggleTheo()">🎓 '+ex.theo.t+'<span class="chev">▾</span></button>'
    + '<div class="theo-b">'+ex.theo.h+'</div></div>';
}

function retryEx(){
  const ex = EXOS[APP.cur];
  APP.st[APP.cur].tries = ex.jx.map(()=>0);

  APP.st[APP.cur].cat   = ex.jx.map(()=>null);

  APP.grid[APP.cur] = ex.jx.map(()=> [emptyRow(),emptyRow(),emptyRow(),emptyRow()]);

}

/* ---------- BILAN FINAL ---------- */
function renderFinal(){
  let tot=0, max=0, f=0, r=0, s=0;
  APP.st.forEach((st,i)=>{
    tot += st.pts; max += EXOS[i].jx.length*PTS_JOURNAL;
    f += st.cat.filter(c=>c==='first').length;
    r += st.cat.filter(c=>c==='retry').length;
    s += st.cat.filter(c=>c==='shown').length;
  });
  const totJ = f+r+s;
  const pct1 = totJ ? Math.round(f/totJ*100) : 0;
  let grade, msg;
  if(pct1>=85){ grade='A — Excellent'; msg="Maîtrise remarquable : comptes, grilles T.V.A. et codes Popsy sont acquis. Tu peux t'attaquer aux écritures de fin d'exercice."; }
  else if(pct1>=65){ grade='B — Très bien'; msg="Très bon niveau. Reprends les exercices marqués 🔄 : ce sont souvent les codes de la déclaration T.V.A. qui coincent."; }
  else if(pct1>=45){ grade='C — Satisfaisant'; msg="Les bases sont là. Refais les exercices marqués 👁 en t'aidant du rappel théorique avant de te lancer."; }
  else { grade='D — À retravailler'; msg="Ne te décourage pas : reprends chapitre par chapitre, en lisant chaque rappel théorique avant de comptabiliser."; }
  const medal = pct1>=90?'🏆':(pct1>=70?'🥇':(pct1>=50?'🥈':'🥉'));

  let h = '<div class="card grade"><div class="medal">'+medal+'</div><div class="gr">'+grade+'</div>'
        + '<div class="muted">'+pct1+' % des écritures réussies du premier coup</div>'
        + '<div class="small muted" style="max-width:520px;margin:12px auto 0">'+msg+'</div></div>';

  h += '<div class="card"><div class="stats">'
     + '<div class="stat"><div class="v" style="color:var(--accent)">'+f+'</div><div class="k">✅ 1<sup>er</sup> coup</div></div>'
     + '<div class="stat"><div class="v" style="color:var(--orange)">'+r+'</div><div class="k">🔄 corrigées</div></div>'
     + '<div class="stat"><div class="v" style="color:var(--error)">'+s+'</div><div class="k">👁 montrées</div></div>'
     + '<div class="stat"><div class="v">'+tot+'/'+max+'</div><div class="k">⭐ points</div></div>'
     + '<div class="stat"><div class="v mono">'+fmtTime(elapsed())+'</div><div class="k">⏱️ temps</div></div>'
     + '</div>';

  h += '<div class="legend"><span class="pill">✅ <b>1<sup>er</sup> coup</b></span><span class="pill">🔄 <b>corrigée</b></span><span class="pill">👁 <b>montrée</b></span></div>';
  h += '<div style="overflow-x:auto"><table class="bilan"><thead><tr><th>#</th><th>Exercice</th><th class="c">✅</th><th class="c">🔄</th><th class="c">👁</th><th class="c">Points</th></tr></thead><tbody>';
  APP.st.forEach((st,i)=>{
    const m = EXOS[i].jx.length*PTS_JOURNAL;
    h += '<tr><td class="c">'+EXOS[i].n+'</td><td>'+EXOS[i].t+'</td>'
       + '<td class="c">'+st.cat.filter(c=>c==='first').length+'</td>'
       + '<td class="c">'+st.cat.filter(c=>c==='retry').length+'</td>'
       + '<td class="c">'+st.cat.filter(c=>c==='shown').length+'</td>'
       + '<td class="c">'+(st.done?st.pts+'/'+m:'—')+'</td></tr>';
  });
  h += '</tbody></table></div></div>';

  // Bilan par chapitre
  const chs = [];
  EXOS.forEach((ex,i)=>{ let c = chs.find(x=>x.ch===ex.ch); if(!c){ c={ch:ex.ch,pts:0,max:0,done:0,n:0}; chs.push(c); }
    c.n++; if(APP.st[i].done){ c.done++; c.pts += APP.st[i].pts; c.max += ex.jx.length*PTS_JOURNAL; } });
  h += '<div class="card"><h3 style="margin-bottom:10px">🎯 Bilan par chapitre</h3><div style="overflow-x:auto"><table class="bilan"><thead><tr><th>Chapitre</th><th class="c">Exercices faits</th><th class="c">Réussite</th><th class="c">Statut</th></tr></thead><tbody>';
  const revoir = [];
  chs.forEach(c=>{
    const pc = c.max ? Math.round(c.pts/c.max*100) : null;
    let stt = '—';
    if(pc!==null){ stt = pc>=80 ? '✅ atteint' : (pc>=50 ? '🟠 en cours' : '❌ non atteint'); if(pc<80) revoir.push(c.ch); }
    h += '<tr><td>'+c.ch+'</td><td class="c">'+c.done+' / '+c.n+'</td><td class="c">'+(pc===null?'—':pc+' %')+'</td><td class="c">'+stt+'</td></tr>';
  });
  h += '</tbody></table></div>';
  if(revoir.length){
    h += '<div class="fb fb-hint" style="margin-top:12px"><h4>📚 À revoir dans ton cours</h4><ul>';
    revoir.forEach(ch=> h += '<li class="small"><b>'+ch+'</b> — '+CH_REVOIR[ch]+'</li>');
    h += '</ul></div>';
  }
  h += '</div>';

  h += '<div class="card" style="text-align:center"><div class="btn-row" style="justify-content:center">'
     + '<button class="btn btn-acc-outline" onclick="openLB(\'app\')">🏆 Classement — cette app</button>'
     + '<button class="btn btn-org-outline" onclick="openLB(\'global\')">🌍 Classement général</button>'
     + '<button class="btn btn-ghost" onclick="goHub()">☰ Liste des exercices</button>'
     + '<button class="btn btn-primary" onclick="replay()">🔄 Rejouer</button>'
     + '</div></div>';
  document.getElementById('screenFinal').innerHTML = h;
  show('screenFinal');
  if(pct1>=70) confetti();
}

function replay(){
  initState(); APP.score = 0; APP.cur = 0; LASTRES = {};
  TRACKING.sessionId = new Date().toISOString();
  APP.globalTimerStart = Date.now();
  updateHeader(); goHub();
}

function startGame(){ goHub(); }

/* ============================================================
   CHRONOMÈTRES
   ============================================================ */
function elapsed(){ return APP.globalTimerStart ? Math.floor((Date.now()-APP.globalTimerStart)/1000) : 0; }
function fmtTime(s){
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0');
}
function startGlobalTimer(){
  APP.globalTimerStart = Date.now();
  if(APP.globalTimerInterval) clearInterval(APP.globalTimerInterval);
  APP.globalTimerInterval = setInterval(()=>{
    document.getElementById('bTimer').textContent = '⏱️ '+fmtTime(elapsed());
  }, 1000);
}
function startExerciseTimer(){ APP.exerciseStartTime = Date.now(); }
function stopExerciseTimer(){
  if(!APP.exerciseStartTime) return 0;
  const t = Math.max(1, Math.floor((Date.now()-APP.exerciseStartTime)/1000));
  APP.exerciseStartTime = null;
  return t;
}

/* ============================================================
   CONFETTIS
   ============================================================ */
function confetti(){
  const cols = ['#3ae08c','#ff9f43','#4aa8ff','#a78bfa','#ffc94d'];
  for(let i=0;i<70;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100+'vw';
    c.style.background = cols[Math.floor(Math.random()*cols.length)];
    c.style.animationDuration = (2+Math.random()*2)+'s';
    c.style.animationDelay = (Math.random()*.5)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 4600);
  }
}

/* ============================================================
   MODALS DE RÉFÉRENCE
   ============================================================ */
function closeModal(){ document.getElementById('modalHost').innerHTML = ''; }

function openRef(kind){
  const titles = {pcmn:'📖 Plan comptable (P.C.M.N.)', grilles:'📋 Grilles de la déclaration T.V.A.', popsy:'⚙️ Codes T.V.A. Popsy'};
  let h = '<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box wide">'
        + '<div class="modal-h"><h3>'+titles[kind]+'</h3><button class="close-x" onclick="closeModal()">×</button></div>'
        + '<div class="modal-b">';
  if(kind==='pcmn'){
    h += '<input class="field ref-search" id="refQ" placeholder="Rechercher un numéro ou un libellé…" oninput="filterRef()">';
    h += '<div class="ref-list" id="refList">';
    Object.keys(PCMN).forEach(k=> h += '<div class="ref-item"><span class="k">'+k+'</span><span class="v">'+PCMN[k]+'</span></div>');
    h += '</div>';
  } else {
    const arr = kind==='grilles' ? GRILLES : POPSY;
    h += '<input class="field ref-search" id="refQ" placeholder="Rechercher…" oninput="filterRef()"><div class="ref-list" id="refList">';
    arr.forEach(it=>{
      if(it.g) h += '<div class="ref-item" data-grp="1" style="border:none;padding-top:12px"><span class="v" style="color:var(--orange);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.8px">'+it.g+'</span></div>';
      else h += '<div class="ref-item"><span class="k">'+it.k+'</span><span class="v">'+it.v+'</span></div>';
    });
    h += '</div>';
  }
  h += '</div><div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Fermer</button></div></div></div>';
  document.getElementById('modalHost').innerHTML = h;
}
function filterRef(){
  const q = document.getElementById('refQ').value.toLowerCase();
  document.querySelectorAll('#refList .ref-item').forEach(el=>{
    if(el.dataset.grp){ el.style.display = q ? 'none' : 'flex'; return; }
    el.style.display = el.textContent.toLowerCase().includes(q) ? 'flex' : 'none';
  });
}

/* ============================================================
   TRACKING — MODAL EMAIL (JSONP obligatoire)
   ============================================================ */
function showEmailModal(){
  const h = '<div class="modal"><div class="modal-box" style="max-width:480px">'
    + '<div class="modal-h"><h3>👤 Identification</h3></div>'
    + '<div class="modal-b"><p class="small muted" style="margin-bottom:12px">Encode ton adresse e-mail scolaire pour que tes résultats soient enregistrés et que tu apparaisses dans le classement de ta classe.</p>'
    + '<input class="field" id="emIn" type="email" placeholder="prenom.nom@eleve.istlm.be" value="'+APP.email+'" onkeydown="if(event.key===\'Enter\')validateEmail()">'
    + '<div class="err-msg" id="emErr"></div></div>'
    + '<div class="modal-f"><button class="btn btn-primary" id="emailBtn" onclick="validateEmail()">Valider et commencer</button></div>'
    + '</div></div>';
  document.getElementById('modalHost').innerHTML = h;
  setTimeout(()=>{ const i=document.getElementById('emIn'); if(i) i.focus(); }, 250);
}

function validateEmail(){
  const inp = document.getElementById('emIn');
  const err = document.getElementById('emErr');
  const btn = document.getElementById('emailBtn');
  const email = (inp.value||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.textContent = "Adresse e-mail invalide."; return; }
  err.textContent = "Vérification en cours…"; btn.disabled = true;

  const cb = '_cb_' + Date.now();
  const done = ok => { btn.disabled = false; if(!ok) err.textContent = "Cette adresse n'est pas dans la liste de la classe. Vérifie l'orthographe ou préviens ton professeur."; };
  window[cb] = function(resp){
    delete window[cb];
    const sc = document.getElementById('jsonp_email'); if(sc) sc.remove();
    if(resp && resp.found){
      APP.email = email; APP.classe = resp.classe || '';
      localStorage.setItem('student_email', APP.email);
      localStorage.setItem('student_classe', APP.classe);
      TRACKING.sessionId = new Date().toISOString();
      closeModal(); startGlobalTimer(); renderHome();
    } else done(false);
  };
  const s = document.createElement('script');
  s.id = 'jsonp_email';
  s.src = TRACKING.scriptUrl + '?action=check_email&email=' + encodeURIComponent(email) + '&callback=' + cb;
  s.onerror = function(){
    delete window[cb]; s.remove();
    err.innerHTML = "Connexion impossible. <button class='btn btn-sm btn-ghost' onclick='offlineMode()'>Continuer sans enregistrement</button>";
    btn.disabled = false;
  };
  document.body.appendChild(s);
}

function offlineMode(){
  APP.email = ''; APP.classe = '';
  TRACKING.sessionId = new Date().toISOString();
  closeModal(); startGlobalTimer(); renderHome();
}

function sendResult(niveau, points, pointsMax, temps){
  if(!APP.email) return;
  try{
    fetch(TRACKING.scriptUrl, {
      method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"},
      body: JSON.stringify({
        email: APP.email, classe: APP.classe, app: TRACKING.appName,
        niveau: niveau, points: points, pointsMax: pointsMax, temps: temps,
        totalNiveaux: TRACKING.totalNiveaux, sessionId: TRACKING.sessionId
      })
    });
  }catch(e){ console.warn('Envoi impossible', e); }
}

/* ============================================================
   CLASSEMENTS
   ============================================================ */
let LBTAB = 'app';
function openLB(tab){
  LBTAB = tab || 'app';
  const cls = APP.classe ? ' ('+APP.classe+')' : '';
  const h = '<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box wide">'
    + '<div class="modal-h"><h3 id="lbTitle">Classement'+cls+'</h3><button class="close-x" onclick="closeModal()">×</button></div>'
    + '<div class="modal-b"><div class="tabs">'
    + '<button class="tab" id="tabApp" onclick="switchLBTab(\'app\')">🏆 Cette application</button>'
    + '<button class="tab" id="tabGlob" onclick="switchLBTab(\'global\')">🌍 Général</button></div>'
    + '<div id="lbBody" class="muted small">Chargement…</div></div>'
    + '<div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">Fermer</button></div></div></div>';
  document.getElementById('modalHost').innerHTML = h;
  switchLBTab(LBTAB);
}
function switchLBTab(tab){
  LBTAB = tab;
  document.getElementById('tabApp').classList.toggle('on', tab==='app');
  document.getElementById('tabGlob').classList.toggle('on', tab==='global');
  const cls = APP.classe ? ' ('+APP.classe+')' : '';
  document.getElementById('lbTitle').textContent = tab==='app' ? '🏆 Classement — écritures OUTISUD'+cls : '🌍 Classement général'+cls;
  document.getElementById('lbBody').innerHTML = 'Chargement…';
  fetchLeaderboard(tab);
}
function fetchLeaderboard(tab){
  const cb = '_lb_' + Date.now();
  window[cb] = function(resp){
    delete window[cb];
    const sc = document.getElementById('jsonp_lb'); if(sc) sc.remove();
    const list = (resp && (resp.leaderboard || resp.data)) || [];
    renderLeaderboard(list, tab);
  };
  let url = tab==='app'
    ? TRACKING.scriptUrl+'?action=leaderboard_app&app='+encodeURIComponent(TRACKING.appName)+'&mode=last'
    : TRACKING.scriptUrl+'?action=leaderboard_global&mode=last';
  if(APP.classe) url += '&classe='+encodeURIComponent(APP.classe);
  url += '&callback='+cb;
  const s = document.createElement('script');
  s.id = 'jsonp_lb'; s.src = url;
  s.onerror = function(){ delete window[cb]; s.remove();
    document.getElementById('lbBody').innerHTML = '<span class="muted small">Classement indisponible pour le moment.</span>'; };
  document.body.appendChild(s);
}
function renderLeaderboard(list, tab){
  const box = document.getElementById('lbBody');
  if(!box) return;
  if(!list.length){ box.innerHTML = '<span class="muted small">Aucun résultat pour le moment. Sois le premier !</span>'; return; }
  if(tab==='global'){
    list.sort((a,b)=>{
      const pa = a.pct||0, pb = b.pct||0;
      if(pb!==pa) return pb-pa;
      return (a.totalTemps||0)-(b.totalTemps||0);
    });
    list.forEach((e,i)=>{ e.rang = i+1; });
  }
  let h = '<div style="overflow-x:auto"><table class="lb"><thead><tr><th>#</th><th>Élève</th><th>Points</th><th>%</th><th>'
        + (tab==='app'?'Exercices':'Applications')+'</th><th>Temps</th></tr></thead><tbody>';
  list.forEach((row,i)=>{
    const pct = row.pct!=null ? row.pct : (row.pourcentage!=null ? row.pourcentage : 0);
    const temps = row.totalTemps || row.totalTime || 0;
    const count = tab==='app' ? (row.niveauxCompletes||row.niveaux||0) : (row.appsCompletes||row.apps||0);
    const totN = tab==='app' ? (row.totalNiveaux||TRACKING.totalNiveaux) : (row.totalPossibleNiveaux||0);
    const medal = i===0?'🥇':(i===1?'🥈':(i===2?'🥉':(row.rang||i+1)));
    const me = (row.email||'').toLowerCase()===APP.email ? ' class="me"' : '';
    const nom = (row.email||'').split('@')[0].replace(/\./g,' ');
    h += '<tr'+me+'><td>'+medal+'</td><td>'+nom+'</td><td class="mono">'+(row.totalPoints||0)+'</td><td class="mono">'+pct+' %</td>'
       + '<td>'+count+(totN?' / '+totN:'')+'<div class="bar"><i style="width:'+(totN?Math.min(100,count/totN*100):0)+'%"></i></div></td>'
       + '<td class="mono">'+fmtTime(temps)+'</td></tr>';
  });
  box.innerHTML = h+'</tbody></table></div>';
}

/* ============================================================
   INITIALISATION
   ============================================================ */
function init(){
  initState();
  renderHome();
  show('screenHome');
  updateHeader();
  showEmailModal();
}
init();

</script>
